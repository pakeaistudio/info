<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pakeAIstudio</title>
    <style>
        /* Ambil Font Plus Jakarta Sans dari Google Fonts */
        @import url('https://googleapis.com');

        /* Reset & Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden; 
        }

        body {
            background: radial-gradient(circle at center, #0a0b10 0%, #030406 100%);
            color: #00ffcc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
            position: relative;
        }

        /* Latar Belakang Garis Siber Bergerak */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            animation: gridMove 20s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(0, 40px); }
        }

        /* Container Utama dengan Sudut Asimetris */
        .portal-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #6278ad;
            border-radius: 24px 0px 24px 0px; 
            padding: 35px 20px;
            box-shadow: 0 0 30px rgba(98, 120, 173, 0.15), inset 0 0 15px rgba(98, 120, 173, 0.05);
            box-sizing: border-box;
        }

        .portal-wrapper::after {
            content: "PORTAL ACTIVE";
            position: absolute;
            top: -12px;
            right: 20px;
            background: #6278ad;
            color: #ffffff;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 2px 8px;
            border-radius: 3px;
        }

        /* Profile Header */
        .profile-area {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            text-align: left;
        }

        .avatar-glow {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            flex-shrink: 0;
            background: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); 
        }

        .avatar-glow img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-tag {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 11px;
            color: #a4b3d6;
            letter-spacing: 0.5px;
            font-weight: 500;
            line-height: 1.4;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #ff007f;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 5px;
            box-shadow: 0 0 8px #ff007f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Tombol Link */
        .cyber-link {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #6278ad;
            padding: 14px 16px;
            margin: 12px 0;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 12px 0 12px 0;
            width: 100%;
        }

        /* Slot Lingkaran Ikon */
        .thumb-slot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(98, 120, 173, 0.4);
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        /* Styling Khusus untuk SVG Ikon */
        .thumb-slot svg {
            width: 20px;
            height: 20px;
            fill: #6278ad; /* Warna ikon default */
            transition: fill 0.3s, transform 0.3s;
        }

        .text-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-grow: 1;
            min-width: 0;
        }

        .link-text {
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .link-desc {
            color: #a4b3d6;
            font-size: 11px;
            font-weight: 400;
            line-height: 1.4;
            transition: color 0.3s;
            word-wrap: break-word;
        }

        /* Efek Hover */
        .cyber-link:hover {
            background: rgba(98, 120, 173, 0.08);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            transform: translateY(-2px);
        }

        .cyber-link:hover .link-text {
            color: #00ffcc;
        }

        .cyber-link:hover .link-desc {
            color: #ffffff;
        }

        /* Efek Hover Ikon SVG */
        .cyber-link:hover .thumb-slot {
            border-color: #ff007f;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
        }

        .cyber-link:hover .thumb-slot svg {
            fill: #ff007f; /* Ikon otomatis berubah pink saat di-hover */
            transform: scale(1.1);
        }

        .cyber-link::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: #ff007f;
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }

        .cyber-link:hover::before {
            transform: scaleY(1);
        }
    </style>
</head>
